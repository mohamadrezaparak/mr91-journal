
      - name: Inspect project structure
        run: |
          echo "===== ROOT DIRECTORY ====="
          pwd
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 5 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" \
          \) -print
